<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEIRA — Fashion Infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  #canvas-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;

  }

  .site {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {

    justify-content: space-between;
    align-items: flex-start;

  }

  .logo {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 200;
    letter-spacing: 0.12em;
    color: #fff;
    text-transform: uppercase;
  }

  .nav-right {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.45);
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 2rem;
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2.4rem;
  }

  .headline {
    font-size: clamp(3rem, 8vw, 5.8rem);
    font-weight: 300;
    line-height: 1.05;
    margin-bottom: 0;
  }

  .headline span.dim {
    color: rgba(255,255,255,0.28);
  }

  .divider {

    height: 1px;
    background: rgba(255,255,255,0.22);
    margin: 2.4rem auto;
  }

  .subline {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.04em;
    line-height: 1.7;
    margin-bottom: 3rem;
  }

  .waitlist {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 360px;
  }

  .waitlist input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    padding: 0.7rem 0;
    text-align: center;
    outline: none;

  }

  .waitlist input::placeholder { color: rgba(180,140,255,0.65); }
  .waitlist input:focus { border-bottom-color: rgba(255,255,255,0.6); }

  .waitlist button {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    color: #fff;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    padding: 1rem 2rem;
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s;
  }

  .waitlist button:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.6);
  }

  .waitlist button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #form-msg {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.45);
    min-height: 1.2rem;
    text-align: center;
  }

  footer {
    display: flex;
    justify-content: space-between;
    padding: 0 2.8rem 2rem;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.22);
  }

  .vert-top {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 90px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.12));
    z-index: 0;
  }
  .vert-bottom {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 90px;
    background: linear-gradient(to top, transparent, rgba(255,255,255,0.12));
    z-index: 0;
  }
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="vert-top"></div>
<div class="vert-bottom"></div>

<div class="site">
  <nav>
    <div class="logo">NEIRA</div>
    <div class="nav-right">Seoul &nbsp; 2026</div>
  </nav>

  <main class="hero">
    <p class="eyebrow">FASHION INFRASTRUCTURE</p>
    <h1 class="headline">
      From sketch<br>
      <span class="dim">to factory.</span>
    </h1>
    <div class="divider"></div>
    <p class="subline">The technical layer between<br>designers and manufacturers.</p>
    <div class="waitlist">
      <input type="email" id="email-input" placeholder="your@email.com">
      <button id="submit-btn" onclick="submitWaitlist()">REQUEST ACCESS</button>
      <p id="form-msg"></p>
    </div>
  </main>

  <footer>
    <span>neira.fit</span>
    <span>fashion &nbsp;·&nbsp; tech &nbsp;·&nbsp; NEIRA</span>
  </footer>
</div>

<script>
async function submitWaitlist() {
  const email = document.getElementById('email-input').value.trim();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('form-msg');

  if (!email || !email.includes('@')) {
    msg.textContent = 'Please enter a valid email.';
    return;
  }

  btn.textContent = '...';
  btn.disabled = true;
  msg.textContent = '';

  try {
    const res = await fetch('https://formspree.io/f/xqegjqdw', {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email })
    });

    if (res.ok) {
      msg.textContent = "You're on the list.";
      document.getElementById('email-input').value = '';
    } else {
      throw new Error();
    }
  } catch {
    msg.textContent = 'Something went wrong. Try again.';
  }

  btn.textContent = 'REQUEST ACCESS';
  btn.disabled = false;
}

// Allow Enter key to submit
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('email-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitWaitlist();
  });
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function pts(...coords) {
  const v = [];
  for (let i = 0; i < coords.length; i += 3)
    v.push(new THREE.Vector3(coords[i], coords[i+1], coords[i+2]));
  return v;
}

function makeLine(...coords) {
  const g = new THREE.BufferGeometry().setFromPoints(pts(...coords));
  return new THREE.Line(g, jacketMat);
}

function makeLoop(...coords) {
  const pts2 = pts(...coords);

let t = 0;

  world.rotation.x = Math.sin(t * 0.18) * 0.10;

</html>
